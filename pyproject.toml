[project]
name = "davinci-mcp"
version = "1.0.2"
description = "Exhaustive, typed and safe MCP server for DaVinci Resolve."
authors = [{ name = "Delanoe Pirard", email = "delanoe.pirard@gmail.com" }]
license = "Apache-2.0"
readme = "README.md"
keywords = ["mcp", "davinci-resolve", "video-editing", "ai-agents"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1.3,<5",
    "pydantic>=2.11",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/Aedelon/davinci-mcp"
Changelog = "https://github.com/Aedelon/davinci-mcp/blob/main/CHANGELOG.md"

[project.scripts]
davinci-mcp = "davinci_mcp.__main__:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "ruff>=0.13",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PL", "PT", "TRY", "S", "ANN"]
ignore = ["PLR0913", "TRY003", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "S", "PT018"]
"eval/**" = ["PLR0917", "S603", "S607", "ANN401", "E501", "PLR0915", "PLR2004", "T201", "INP001", "N813", "S108"]
"tools/live_smoke.py" = ["S603", "S607", "ANN401", "PLR0915"]
"tools/introspect/**" = ["ANN401", "N813", "PLR0912", "PLR0915", "S603", "S607"]
"src/davinci_mcp/api/_generated/**" = ["E501", "N815", "RUF012"]

[tool.pyright]
include = ["src", "tests", "tools"]
exclude = ["tools/introspect", "tools/live_smoke.py", "eval", "**/.venv*"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingModuleSource = false

[[tool.pyright.executionEnvironments]]
# Tests drive untyped Resolve fakes: keep strict checks, relax "unknown type" noise.
root = "tests"
extraPaths = [".", "src", "tools"]
reportPrivateUsage = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingParameterType = false
reportMissingTypeArgument = false
# Fakes are patched dynamically (setattr, Optional fixtures).
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportUnnecessaryIsInstance = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: requires a running DaVinci Resolve Studio (deselect with -m 'not live')"]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["davinci_mcp"]
omit = ["src/davinci_mcp/api/_generated/*"]
