# Publishes to PyPI with Trusted Publishing (OIDC, no token) and creates the GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_PYTHON: "3.14"

jobs:
  release:
    name: Build, publish, release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/davinci-mcp/
    permissions:
      contents: write # create the GitHub release
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Check the tag matches the package version
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
          for v in "$(jq -r .version server.json)" "$(jq -r '.packages[0].version' server.json)"; do
            if [ "$v" != "$version" ]; then
              echo "server.json version ${v} does not match pyproject version ${version}" >&2
              exit 1
            fi
          done

      - run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

      - name: Publish to the MCP Registry
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher login github-oidc
          # The registry reads the README from PyPI to check ownership; retry while the upload propagates.
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            sleep 30
          done
          exit 1

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Notes: the CHANGELOG section of this version, up to the next "## " heading.
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "davinci-mcp $version" --notes-file notes.md --verify-tag
